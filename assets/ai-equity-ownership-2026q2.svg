<svg xmlns="http://www.w3.org/2000/svg" width="960" height="575" viewBox="0 0 960 575" role="img" aria-labelledby="title desc">
<title id="title">Who owns America's equity wealth?</title>
<desc id="desc">Federal Reserve shares of corporate equities and mutual-fund holdings in 2026 Q2: top 1 percent 50.9 percent, next 9 percent 37.2, next 40 percent 11.4, and bottom 50 percent 0.6.</desc>
<rect width="960" height="575" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="68" y="37" font-size="28" font-weight="700" fill="#111827">Who owns America's equity wealth?</text>
<text x="68" y="67" font-size="17" fill="#374151">Share of US corporate equities and mutual-fund shares, Q2 2026</text>
<line x1="156" y1="86" x2="156" y2="446" stroke="#e6e9ec" stroke-width="1"/><text x="156" y="466" text-anchor="middle" font-size="14" fill="#5d6571">0</text><line x1="280" y1="86" x2="280" y2="446" stroke="#e6e9ec" stroke-width="1"/><text x="280" y="466" text-anchor="middle" font-size="14" fill="#5d6571">10</text><line x1="404" y1="86" x2="404" y2="446" stroke="#e6e9ec" stroke-width="1"/><text x="404" y="466" text-anchor="middle" font-size="14" fill="#5d6571">20</text><line x1="528" y1="86" x2="528" y2="446" stroke="#e6e9ec" stroke-width="1"/><text x="528" y="466" text-anchor="middle" font-size="14" fill="#5d6571">30</text><line x1="652" y1="86" x2="652" y2="446" stroke="#e6e9ec" stroke-width="1"/><text x="652" y="466" text-anchor="middle" font-size="14" fill="#5d6571">40</text><line x1="776" y1="86" x2="776" y2="446" stroke="#e6e9ec" stroke-width="1"/><text x="776" y="466" text-anchor="middle" font-size="14" fill="#5d6571">50</text><text x="140" y="143" text-anchor="end" fill="#475467" font-size="17" font-weight="600">Top 1%</text><rect x="156" y="112" width="631.2" height="50" fill="#c43c30"/><text x="799.2" y="144" font-size="18" fill="#1f2933">50.9%</text><text x="140" y="231" text-anchor="end" fill="#475467" font-size="17" font-weight="600">Next 9%</text><rect x="156" y="200" width="461.3" height="50" fill="#344f66"/><text x="629.3" y="232" font-size="18" fill="#1f2933">37.2%</text><text x="140" y="319" text-anchor="end" fill="#475467" font-size="17" font-weight="600">Next 40%</text><rect x="156" y="288" width="141.4" height="50" fill="#7890a1"/><text x="309.4" y="320" font-size="18" fill="#1f2933">11.4%</text><text x="140" y="407" text-anchor="end" fill="#475467" font-size="17" font-weight="600">Bottom 50%</text><rect x="156" y="376" width="7.4" height="50" fill="#a9b6bd"/><text x="175.4" y="408" font-size="18" fill="#1f2933">0.6%</text>
<text x="504" y="497" text-anchor="middle" font-size="16" fill="#374151">Share of aggregate holdings (%)</text>
<text x="68" y="528" font-size="12.5" fill="#525c68">Source: Federal Reserve Distributional Financial Accounts via FRED; visualisation based on R analysis.</text>
